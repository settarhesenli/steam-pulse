<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password — GamePrice</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #060a0f;
            color: #e8eef5;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            padding: 30px;
            border: 1px solid #1b2a38;
            border-radius: 16px;
            background: #0a1119;
            box-shadow: 0 20px 60px rgba(0,0,0,.35);
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: #718195;
            text-decoration: none;
            font-size: 12px;
        }

        .back:hover {
            color: #58ffad;
        }

        h1 {
            margin: 0;
            font-size: 24px;
        }

        .subtitle {
            margin-top: 8px;
            margin-bottom: 25px;
            color: #657588;
            font-size: 12px;
        }

        .field {
            margin-bottom: 17px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #9aa8b8;
            font-size: 11px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 12px 13px;
            border: 1px solid #233342;
            border-radius: 9px;
            outline: none;
            background: #080e15;
            color: #f2f5f8;
            font-size: 13px;
        }

        input:focus {
            border-color: rgba(0,255,136,.5);
            box-shadow: 0 0 0 2px rgba(0,255,136,.07);
        }

        button {
            width: 100%;
            margin-top: 5px;
            padding: 12px;
            border: 1px solid rgba(0,255,136,.35);
            border-radius: 9px;
            background: rgba(0,255,136,.08);
            color: #58ffad;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
        }

        button:hover {
            background: rgba(0,255,136,.14);
            border-color: rgba(0,255,136,.55);
        }

        .hint {
            margin-top: 18px;
            color: #536579;
            font-size: 10px;
            line-height: 1.5;
        }
    </style>
</head>

<body>

<div class="card">

    <a href="/account" class="back">← Back to Account</a>

    <h1>🔐 Change Password</h1>

    <div class="subtitle">
        Update your account password securely.
    </div>

    <form method="POST" action="/account/change-password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="field">
            <label for="current_password">CURRENT PASSWORD</label>
            <input
                type="password"
                id="current_password"
                name="current_password"
                autocomplete="current-password"
                required
            >
        </div>

        <div class="field">
            <label for="new_password">NEW PASSWORD</label>
            <input
                type="password"
                id="new_password"
                name="new_password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </div>

        <div class="field">
            <label for="confirm_password">CONFIRM NEW PASSWORD</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                autocomplete="new-password"
                minlength="8"
                required
            >
        </div>

        <button type="submit">
            UPDATE PASSWORD
        </button>

    </form>

    <div class="hint">
        Your new password must contain at least 8 characters.
    </div>

</div>

</body>
</html>
