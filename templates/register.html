<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Steam Price Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Inter, Arial, sans-serif;
            background:
                radial-gradient(circle at 20% 20%, rgba(0, 255, 136, 0.08), transparent 30%),
                radial-gradient(circle at 80% 80%, rgba(40, 100, 255, 0.08), transparent 30%),
                #070b14;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.018) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
            background-size: 45px 45px;
            pointer-events: none;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 460px;
            padding: 24px;
            position: relative;
            z-index: 2;
        }

        .auth-card {
            position: relative;
            background: rgba(12, 18, 30, 0.94);
            border: 1px solid rgba(255,255,255,.08);
            border-radius: 20px;
            padding: 38px;
            box-shadow:
                0 30px 80px rgba(0,0,0,.55),
                0 0 45px rgba(0,255,136,.05);
            backdrop-filter: blur(18px);
        }

        .glow {
            position: absolute;
            width: 180px;
            height: 180px;
            background: #00ff88;
            filter: blur(100px);
            opacity: .07;
            top: -80px;
            left: -70px;
            pointer-events: none;
        }

        .logo {
            text-align: center;
            margin-bottom: 28px;
        }

        .logo-mark {
            width: 54px;
            height: 54px;
            margin: 0 auto 14px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #123c2b, #0b1d17);
            border: 1px solid rgba(0,255,136,.3);
            color: #58ffad;
            font-size: 25px;
            box-shadow: 0 0 25px rgba(0,255,136,.12);
        }

        .logo h1 {
            margin: 0;
            font-size: 25px;
            letter-spacing: -.5px;
        }

        .logo p {
            margin: 8px 0 0;
            color: #7e8a9f;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #c8d0dc;
            font-size: 13px;
            font-weight: 600;
        }

        input {
            width: 100%;
            height: 50px;
            padding: 0 15px;
            border-radius: 11px;
            border: 1px solid #263143;
            outline: none;
            background: #0a101b;
            color: #fff;
            font-size: 14px;
            transition: .2s ease;
        }

        input::placeholder {
            color: #566276;
        }

        input:focus {
            border-color: rgba(0,255,136,.65);
            box-shadow: 0 0 0 3px rgba(0,255,136,.08);
        }

        .password-hint {
            margin-top: 7px;
            color: #59667a;
            font-size: 11px;
        }

        .register-btn {
            width: 100%;
            height: 52px;
            margin-top: 8px;
            border: 0;
            border-radius: 11px;
            cursor: pointer;
            background: linear-gradient(135deg, #00e87a, #00ff9a);
            color: #04100a;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: .2px;
            box-shadow: 0 10px 30px rgba(0,255,136,.16);
            transition: .2s ease;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 35px rgba(0,255,136,.25);
        }

        .login-link {
            text-align: center;
            margin-top: 23px;
            color: #697589;
            font-size: 13px;
        }

        .login-link a {
            color: #55ffa8;
            text-decoration: none;
            font-weight: 700;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #687488;
            text-decoration: none;
            font-size: 12px;
        }

        .back-home:hover {
            color: #aeb8c8;
        }

        @media (max-width: 520px) {
            .auth-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="auth-wrapper">

    <div class="auth-card">
        <div class="glow"></div>

        <div class="logo">
            <div class="logo-mark">◈</div>
            <h1>Create your account</h1>
            <p>Track games. Compare prices. Find better deals.</p>
        </div>

        <form method="POST" action="/register">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="form-group">
                <label for="username">USERNAME</label>
                <input
                    id="username"
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required
                    minlength="3"
                    maxlength="50"
                    autocomplete="username"
                >
            </div>

            <div class="form-group">
                <label for="email">EMAIL</label>
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="you@example.com"
                    required
                    maxlength="120"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="password">PASSWORD</label>
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Create a strong password"
                    required
                    minlength="8"
                    autocomplete="new-password"
                >
                <div class="password-hint">
                    Minimum 8 characters
                </div>
            </div>

            <button class="register-btn" type="submit">
                CREATE ACCOUNT
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="/login">Login</a>
        </div>
    </div>

    <a class="back-home" href="/">
        ← Back to Dashboard
    </a>

</div>

</body>
</html>
